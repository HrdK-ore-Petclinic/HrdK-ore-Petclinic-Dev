name: CI/CD — Dev (Fresh Build)

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch"
        required: true
        default: "dev"

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, k8s]

    env:
      SERVICES: |
        spring-petclinic-admin-server
        spring-petclinic-api-gateway
        spring-petclinic-config-server
        spring-petclinic-customers-service
        spring-petclinic-discovery-server
        spring-petclinic-genai-service
        spring-petclinic-vets-service
        spring-petclinic-visits-service

    steps:
      # ------------------------
      # CHECKOUT
      # ------------------------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.branch }}

      # ------------------------
      # JAVA + BUILD
      # ------------------------
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Build all services
        run: mvn clean package -DskipTests

      # ------------------------
      # VERIFY JARS (WICHTIG)
      # ------------------------
      - name: Verify JARs exist
        run: |
          for SVC in $SERVICES; do
            echo "Checking $SVC..."
            if ! ls ./$SVC/target/*.jar 1> /dev/null 2>&1; then
              echo "❌ Missing JAR in $SVC"
              exit 1
            fi
          done

      # ------------------------
      # DOCKER LOGIN
      # ------------------------
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ------------------------
      # BUILD + PUSH
      # ------------------------
      - name: Build & Push Images
        run: |
          for SVC in $SERVICES; do
            IMAGE=${{ secrets.DOCKER_USERNAME }}/$SVC:latest

            echo "🚀 Building $SVC"
            docker build \
              --no-cache \
              --pull \
              -t $IMAGE \
              ./$SVC

            echo "📦 Pushing $SVC"
            docker push $IMAGE
          done

      # ------------------------
      # K8S CONFIG
      # ------------------------
      - name: Setup kubeconfig
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" > kubeconfig
          echo "KUBECONFIG=$PWD/kubeconfig" >> $GITHUB_ENV

      - name: Use dev context
        run: kubectl config use-context kubernetes-admin-dev

      # ------------------------
      # APPLY
      # ------------------------
      - name: Apply manifests
        run: kubectl apply -f k8s/

      # ------------------------
      # FORCE REDEPLOY
      # ------------------------
      - name: Restart deployments
        run: |
          kubectl rollout restart deployment -n dev
          kubectl rollout status deployment -n dev --timeout=300s

      # ------------------------
      # VERIFY
      # ------------------------
      - name: Verify
        run: kubectl get pods -n dev
