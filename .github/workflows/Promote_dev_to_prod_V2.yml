name: Promote Image V2 (Dev → Prod Tag)

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Select service to promote"
        required: true
        type: choice
        options:
          - all
          - spring-petclinic-admin-server
          - spring-petclinic-api-gateway
          - spring-petclinic-config-server
          - spring-petclinic-customers-service
          - spring-petclinic-discovery-server
          - spring-petclinic-genai-service
          - spring-petclinic-vets-service
          - spring-petclinic-visits-service

      version:
        description: "Target version (e.g. v1.2.0)"
        required: true

      commit:
        description: "Commit tag (or dev/latest)"
        required: true

jobs:
  promote:
    runs-on: ubuntu-latest

    env:
      REGISTRY: ${{ secrets.DOCKER_USERNAME }}
      SERVICES: |
        spring-petclinic-admin-server
        spring-petclinic-api-gateway
        spring-petclinic-config-server
        spring-petclinic-customers-service
        spring-petclinic-discovery-server
        spring-petclinic-genai-service
        spring-petclinic-vets-service
        spring-petclinic-visits-service

    steps:
      # ------------------------
      # KUBECTL SETUP
      # ------------------------
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config

      # ------------------------
      # DOCKER LOGIN
      # ------------------------
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ------------------------
      # PROMOTION LOGIC (FIXED)
      # ------------------------
      - name: Promote Images (safe)
        run: |
          set -e

          docker pull $SRC
          
          SELECTED="${{ github.event.inputs.service }}"
          VERSION="${{ github.event.inputs.version }}"
          COMMIT="${{ github.event.inputs.commit }}"
          REGISTRY="${{ env.REGISTRY }}"
          
          SHORT_COMMIT=$(echo "$COMMIT" | cut -c1-7)
          
          HEADER_DIGEST="n/a"
          
          if [ "$SELECTED" != "all" ]; then
            SRC="$REGISTRY/$SELECTED:$COMMIT"
          
            if docker pull $SRC >/dev/null 2>&1; then
              HEADER_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $SRC | cut -d'@' -f2 | cut -c1-7)
            fi
          fi
          
          echo "======================================"
          echo "PROMOTION START"
          echo "Service: $SELECTED"
          echo "Commit : $SHORT_COMMIT"
          echo "Digest : $HEADER_DIGEST"
          echo "Version: $VERSION"
          echo "======================================"

          for SVC in $SERVICES; do

            # ------------------------
            # FILTER
            # ------------------------
            if [ "$SELECTED" != "all" ] && [ "$SELECTED" != "$SVC" ]; then
              continue
            fi

            SRC="$REGISTRY/$SVC:$COMMIT"
            TARGET="$REGISTRY/$SVC:$VERSION"

            echo ""
            echo "--------------------------------------"
            echo "Service: $SVC"
            echo "Source : $SRC"
            echo "Target : $TARGET"

            # ------------------------
            # WARNING
            # ------------------------
            if [ "$COMMIT" = "dev" ] || [ "$COMMIT" = "latest" ]; then
              echo "⚠️⚠️⚠️ WARNING: using mutable tag ($COMMIT)"
            fi

            # ------------------------
            # PULL SOURCE (REQUIRED!)
            # ------------------------
            if ! docker pull $SRC >/dev/null 2>&1; then
              echo "❌❌❌ Source image not found → STOP ❌❌❌"
              exit 1
            fi

            SRC_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $SRC | cut -d'@' -f2)

            if [ -z "$SRC_DIGEST" ]; then
              echo "❌❌❌ Could not resolve source digest → STOP ❌❌❌"
              exit 1
            fi

            echo "Source digest: $SRC_DIGEST"

            # ------------------------
            # TARGET EXISTS CHECK
            # ------------------------
            if docker manifest inspect $TARGET >/dev/null 2>&1; then
              echo "❌❌❌ Target version already exists → STOP ❌❌❌"
              exit 1
            fi

            # ------------------------
            # GET CURRENT IMAGE FROM K8S
            # ------------------------
            CURRENT_IMAGE=$(kubectl -n prod get deployment $SVC \
              -o=jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo "")

            if [ -z "$CURRENT_IMAGE" ]; then
              echo "❌❌❌ Could not determine current running image → STOP ❌❌❌"
              exit 1
            fi

            echo "Current image: $CURRENT_IMAGE"

            # ------------------------
            # PULL CURRENT IMAGE
            # ------------------------
            if ! docker pull $CURRENT_IMAGE >/dev/null 2>&1; then
              echo "❌❌❌ Failed to pull current image → STOP ❌❌❌"
              exit 1
            fi

            CURRENT_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $CURRENT_IMAGE | cut -d'@' -f2)

            if [ -z "$CURRENT_DIGEST" ]; then
              echo "❌❌❌ Could not resolve current digest → STOP ❌❌❌"
              exit 1
            fi

            echo "Current digest: $CURRENT_DIGEST"

            # ------------------------
            #  CRITICAL CHECK
            # ------------------------
            if [ "$SRC_DIGEST" = "$CURRENT_DIGEST" ]; then
              echo "❌❌❌ SAME IMAGE AS PROD → HARD STOP ❌❌❌"
              exit 1
            fi

            # ------------------------
            # PROMOTE
            # ------------------------
            docker tag $SRC $TARGET
            docker push $TARGET

            echo "✅✅✅ Promoted ✅✅✅ $SVC"

            # ------------------------
            # REMOVE dev + latest TAGS (REMOTE)
            # ------------------------
            for TAG in dev latest; do
              echo "Removing tag: $TAG for $SVC"

              curl -s -X DELETE \
                -u "${{ secrets.DOCKER_USERNAME }}:${{ secrets.DOCKER_PASSWORD }}" \
                https://hub.docker.com/v2/repositories/${REGISTRY}/$SVC/tags/$TAG/ \
                && echo "Deleted: $TAG" \
                || echo "Tag not found or already deleted: $TAG"
            done
          echo ""
          echo "✅✅✅ REMOVE DEV AND LATEST PROMOTION FINISHED ✅✅✅"
