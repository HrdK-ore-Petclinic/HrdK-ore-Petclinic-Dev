name: Promote Image V2(Dev → Prod Tag)

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Select service to promote"
        required: true
        type: choice
        options:
          - all
          - spring-petclinic-admin-server
          - spring-petclinic-api-gateway
          - spring-petclinic-config-server
          - spring-petclinic-customers-service
          - spring-petclinic-discovery-server
          - spring-petclinic-genai-service
          - spring-petclinic-vets-service
          - spring-petclinic-visits-service

      version:
        description: "Target version (e.g. v1.2.0)"
        required: true

      commit:
        description: "Commit tag (or dev/latest)"
        required: true

jobs:
  promote:
    runs-on: ubuntu-latest

    env:
      REGISTRY: ${{ secrets.DOCKER_USERNAME }}
      SERVICES: |
        spring-petclinic-admin-server
        spring-petclinic-api-gateway
        spring-petclinic-config-server
        spring-petclinic-customers-service
        spring-petclinic-discovery-server
        spring-petclinic-genai-service
        spring-petclinic-vets-service
        spring-petclinic-visits-service

    steps:
      # ------------------------
      # INSTALL TOOLS
      # ------------------------
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      # ------------------------
      # KUBECTL SETUP
      # ------------------------
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" > ~/.kube/config

      # ------------------------
      # DOCKER LOGIN
      # ------------------------
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ------------------------
      # PROMOTION LOGIC
      # ------------------------
      - name: Promote Images (safe)
        run: |
          set -e

          SELECTED="${{ github.event.inputs.service }}"
          VERSION="${{ github.event.inputs.version }}"
          COMMIT="${{ github.event.inputs.commit }}"
          REGISTRY="${{ env.REGISTRY }}"

          echo "======================================"
          echo "PROMOTION START"
          echo "Service: $SELECTED"
          echo "Commit : $COMMIT"
          echo "Version: $VERSION"
          echo "======================================"

          for SVC in $SERVICES; do

            # ------------------------
            # DROPDOWN FILTER
            # ------------------------
            if [ "$SELECTED" != "all" ] && [ "$SELECTED" != "$SVC" ]; then
              continue
            fi

            SRC="$REGISTRY/$SVC:$COMMIT"
            TARGET="$REGISTRY/$SVC:$VERSION"

            echo ""
            echo "--------------------------------------"
            echo "Service: $SVC"
            echo "Source : $SRC"
            echo "Target : $TARGET"

            # ------------------------
            # WARNING: MUTABLE TAGS
            # ------------------------
            if [ "$COMMIT" = "dev" ] || [ "$COMMIT" = "latest" ]; then
              echo "⚠️ WARNING: using mutable tag ($COMMIT)"
            fi

            # ------------------------
            # CHECK SOURCE EXISTS
            # ------------------------
            if ! docker manifest inspect $SRC >/dev/null 2>&1; then
              echo "❌ Source image not found → STOP"
              exit 1
            fi

            SRC_DIGEST=$(docker manifest inspect $SRC | jq -r '.config.digest')
            echo "Source digest: $SRC_DIGEST"

            # ------------------------
            # CHECK TARGET EXISTS
            # ------------------------
            if docker manifest inspect $TARGET >/dev/null 2>&1; then
              echo "❌ Target version already exists → STOP"
              exit 1
            fi

            # ------------------------
            # CHECK CURRENT PROD DIGEST
            # ------------------------
            CURRENT_IMAGE=$(kubectl -n prod get deployment $SVC \
              -o=jsonpath='{.spec.template.spec.containers[0].image}' 2>/dev/null || echo "")

            if [ -n "$CURRENT_IMAGE" ]; then
              CURRENT_DIGEST=$(docker manifest inspect $CURRENT_IMAGE | jq -r '.config.digest')

              echo "Current image : $CURRENT_IMAGE"
              echo "Current digest: $CURRENT_DIGEST"

              if [ "$SRC_DIGEST" = "$CURRENT_DIGEST" ]; then
                echo "❌ SAME IMAGE AS PROD → STOP"
                exit 1
              fi
            else
              echo "⚠️ No current deployment found (first deploy?)"
            fi

            # ------------------------
            # PROMOTE
            # ------------------------
            docker pull $SRC
            docker tag $SRC $TARGET
            docker push $TARGET

            echo "✅ Promoted $SVC"
          done

          echo ""
          echo "🎉 PROMOTION FINISHED"
