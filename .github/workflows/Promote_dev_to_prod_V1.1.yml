name: Promote&Build Image (Dev → Prod)

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Select service to promote"
        required: true
        type: choice
        options:
          - all
          - spring-petclinic-admin-server
          - spring-petclinic-api-gateway
          - spring-petclinic-config-server
          - spring-petclinic-customers-service
          - spring-petclinic-discovery-server
          - spring-petclinic-genai-service
          - spring-petclinic-vets-service
          - spring-petclinic-visits-service

      version:
        description: "Prod version (e.g. v1.2.0)"
        required: true

      commit:
        description: "Optional commit (leave empty = latest)"
        required: false

jobs:
  promote:
    runs-on: ubuntu-latest

    env:
      SERVICES: |
        spring-petclinic-admin-server
        spring-petclinic-api-gateway
        spring-petclinic-config-server
        spring-petclinic-customers-service
        spring-petclinic-discovery-server
        spring-petclinic-genai-service
        spring-petclinic-vets-service
        spring-petclinic-visits-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine commit
        id: commit
        run: |
          if [ -z "${{ github.event.inputs.commit }}" ]; then
            COMMIT=$(git rev-parse --short HEAD)
          else
            COMMIT=${{ github.event.inputs.commit }}
          fi

          echo "commit=$COMMIT" >> $GITHUB_OUTPUT

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Promote via REBUILD (clean prod image)
        run: |
          set -e

          VERSION=${{ github.event.inputs.version }}
          USER=${{ secrets.DOCKER_USERNAME }}

          # Tools
          sudo apt-get update && sudo apt-get install -y jq

          for SVC in $SERVICES; do

            if [ "${{ github.event.inputs.service }}" != "all" ] && [ "${{ github.event.inputs.service }}" != "$SVC" ]; then
              continue
            fi

            IMAGE=$USER/$SVC

            echo "======================================"
            echo "🚀 Building CLEAN PROD image for $SVC"
            echo "======================================"

            # 🔥 REBUILD instad of TAGGING
            docker build \
              --build-arg BUILD_STAGE=prod \
              -t $IMAGE:$VERSION \
              -f ./$SVC/Dockerfile .

            docker push $IMAGE:$VERSION

            # 🔍 Get digest
            TARGET_DIGEST=$(docker manifest inspect $IMAGE:$VERSION | jq -r '.config.digest')

            echo "Prod Digest: $TARGET_DIGEST"

            # 🔐 Get Token
            TOKEN=$(curl -s -H "Content-Type: application/json" \
              -X POST \
              -d '{"username":"'"$USER"'","password":"${{ secrets.DOCKER_PASSWORD }}"}' \
              https://hub.docker.com/v2/users/login/ | jq -r .token)

            # ❌ Delete dev/latest
            for TAG in dev latest; do
              echo "🧹 Deleting tag: $TAG"

              curl -s -o /dev/null -w "%{http_code}" \
                -X DELETE \
                -H "Authorization: JWT $TOKEN" \
                https://hub.docker.com/v2/repositories/$USER/$SVC/tags/$TAG/
            done

            # 🔍 Get all TAGS
            TAGS=$(curl -s https://registry.hub.docker.com/v2/repositories/$USER/$SVC/tags?page_size=100 | jq -r '.results[].name')

            MATCHES=0

            echo "🔍 Checking tag → digest mapping..."

            for TAG in $TAGS; do
              DIGEST=$(docker manifest inspect $IMAGE:$TAG | jq -r '.config.digest')

              if [ "$DIGEST" = "$TARGET_DIGEST" ]; then
                echo "MATCH → $TAG"
                MATCHES=$((MATCHES+1))
              fi
            done

            # ❗ VALIDATE
            if [ "$MATCHES" -ne 1 ]; then
              echo "❌ ERROR: Multiple tags reference the same prod image!"
              exit 1
            fi

            echo "✅ CLEAN: Only $VERSION points to this image"

            # 🧹 Cleanup Runner
            docker rmi $IMAGE:$VERSION || true

          done
