name: CI/CD — Dev

on:
  push:
    branches: [dev]

  workflow_dispatch:
    inputs:
      branch:
        description: "Branch"
        required: true
        default: "dev"
      service:
        description: "Service to build (all = auto-detect changes)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - spring-petclinic-admin-server
          - spring-petclinic-api-gateway
          - spring-petclinic-config-server
          - spring-petclinic-customers-service
          - spring-petclinic-discovery-server
          - spring-petclinic-genai-service
          - spring-petclinic-vets-service
          - spring-petclinic-visits-service

concurrency:
  group: dev-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ------------------------
  # 1. DETECT CHANGES
  # ------------------------
  detect-changes:
    runs-on: [self-hosted, Linux, X64, k8s]

    outputs:
      services: ${{ steps.set.outputs.services }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}
          fetch-depth: 2

      - name: Detect changed services
        id: set
        run: |
          ALL_SERVICES='[
            "spring-petclinic-admin-server",
            "spring-petclinic-api-gateway",
            "spring-petclinic-config-server",
            "spring-petclinic-customers-service",
            "spring-petclinic-discovery-server",
            "spring-petclinic-genai-service",
            "spring-petclinic-vets-service",
            "spring-petclinic-visits-service"
          ]'

          # ✅ При push — service всегда "all" (auto-detect)
          SELECTED="${{ github.event.inputs.service || 'all' }}"

          if [ "$SELECTED" != "all" ]; then
            SERVICES="[\"$SELECTED\"]"
            echo "🎯 Manual selection: $SELECTED"
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD \
              | grep -oP 'spring-petclinic-[^/]+' \
              | sort -u \
              | jq -R . | jq -sc .)

            if [ -z "$CHANGED" ] || [ "$CHANGED" = "[]" ] || [ "$CHANGED" = "null" ]; then
              echo "⚠️ No service changes detected — building ALL"
              SERVICES=$ALL_SERVICES
            else
              echo "🔍 Changed services: $CHANGED"
              SERVICES=$CHANGED
            fi
          fi

          echo "services=$SERVICES" >> $GITHUB_OUTPUT
          echo "Final services to build: $SERVICES"

  # ------------------------
  # 2. BUILD + SCAN + PUSH + DEPLOY
  # ------------------------
  deploy:
    needs: detect-changes
    runs-on: [self-hosted, Linux, X64, k8s]

    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
      fail-fast: false

    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Ensure Trivy installed
        run: |
          if command -v trivy >/dev/null 2>&1; then
            echo "✅ Trivy уже установлен: $(trivy --version | head -1)"
          else
            echo "📦 Installing Trivy..."
            sudo apt-get install -y wget apt-transport-https gnupg
            wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key \
              | gpg --dearmor \
              | sudo tee /usr/share/keyrings/trivy.gpg > /dev/null
            echo "deb [signed-by=/usr/share/keyrings/trivy.gpg] \
              https://aquasecurity.github.io/trivy-repo/deb generic main" \
              | sudo tee /etc/apt/sources.list.d/trivy.list
            sudo apt-get update -qq
            sudo apt-get install -y trivy
          fi

      - name: Build, Scan & Push — ${{ matrix.service }}
        run: |
          set -e
          COMMIT=${GITHUB_SHA::7}
          IMAGE=${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}

          echo "🔖 Commit : $COMMIT"
          echo "📦 Service: ${{ matrix.service }}"

          docker build \
            -t $IMAGE:$COMMIT \
            -t $IMAGE:latest \
            ./${{ matrix.service }}

          trivy image \
            --exit-code 1 \
            --severity CRITICAL \
            --ignore-unfixed \
            --quiet \
            $IMAGE:$COMMIT

          echo "✅ Scan passed"

          docker push $IMAGE:$COMMIT
          docker push $IMAGE:latest

          docker image rm $IMAGE:$COMMIT $IMAGE:latest || true

      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy — ${{ matrix.service }}
        run: |
          COMMIT=${GITHUB_SHA::7}
          SHORT=$(echo "${{ matrix.service }}" | sed 's/spring-petclinic-//')

          kubectl apply -f k8s/${SHORT}-deployment.yaml -n dev
          kubectl apply -f k8s/${SHORT}-service.yaml -n dev

          kubectl set image deployment/${SHORT} \
            ${SHORT}=${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:${COMMIT} \
            -n dev

          if ! kubectl rollout status deployment/${SHORT} -n dev --timeout=300s; then
            echo "❌ Rollout failed for ${SHORT}"
            kubectl get pods -n dev -l app=${SHORT}
            kubectl describe pods -n dev -l app=${SHORT} | tail -50
            exit 1
          fi

          echo "✅ Deployed: ${SHORT}"

  # ------------------------
  # 3. VERIFY
  # ------------------------
  verify:
    needs: deploy
    runs-on: [self-hosted, Linux, X64, k8s]
    if: always()

    steps:
      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Show pod status
        run: kubectl get pods -n dev