name: CI/CD — Dev

on:
  push:
    branches: [dev]

  workflow_dispatch:
    inputs:
      branch:
        description: "Branch"
        required: true
        default: "dev"
      service:
        description: "Service to build (all = auto-detect changes)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - spring-petclinic-admin-server
          - spring-petclinic-api-gateway
          - spring-petclinic-config-server
          - spring-petclinic-customers-service
          - spring-petclinic-discovery-server
          - spring-petclinic-genai-service
          - spring-petclinic-vets-service
          - spring-petclinic-visits-service

concurrency:
  group: dev-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ------------------------
  # 1. TEST
  # ------------------------
  test:
    runs-on: [self-hosted, Linux, X64, k8s]

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Run unit tests
        run: |
          mvn test --batch-mode -pl '!spring-petclinic-api-gateway'
          # api-gateway excluded — it has no unit tests

  # ------------------------
  # 2. DETECT CHANGES
  # ------------------------
  detect-changes:
    needs: test
    runs-on: [self-hosted, Linux, X64, k8s]

    outputs:
      services: ${{ steps.set.outputs.services }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}
          fetch-depth: 2

      - name: Detect changed services
        id: set
        run: |
          # Single line required — GitHub Actions output does not support multiline
          ALL_SERVICES='["spring-petclinic-admin-server","spring-petclinic-api-gateway","spring-petclinic-config-server","spring-petclinic-customers-service","spring-petclinic-discovery-server","spring-petclinic-genai-service","spring-petclinic-vets-service","spring-petclinic-visits-service"]'

          SELECTED="${{ github.event.inputs.service || 'all' }}"

          if [ "$SELECTED" != "all" ]; then
            SERVICES="[\"$SELECTED\"]"
            echo "🎯 Manual selection: $SELECTED"
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD \
              | grep -oP 'spring-petclinic-[^/]+' \
              | sort -u \
              | jq -R . | jq -sc .)

            if [ -z "$CHANGED" ] || [ "$CHANGED" = "[]" ] || [ "$CHANGED" = "null" ]; then
              echo "⚠️ No service changes detected — building ALL"
              SERVICES="$ALL_SERVICES"
            else
              echo "🔍 Changed services: $CHANGED"
              SERVICES="$CHANGED"
            fi
          fi

          echo "services=$SERVICES" >> $GITHUB_OUTPUT
          echo "Final services to build: $SERVICES"

  # ------------------------
  # 3. BUILD + SCAN + PUSH + DEPLOY
  # ------------------------
  deploy:
    needs: detect-changes
    runs-on: [self-hosted, Linux, X64, k8s]

    strategy:
      matrix:
        service: ${{ fromJson(needs.detect-changes.outputs.services) }}
      fail-fast: false

    steps:

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.branch || github.ref_name }}

      # ------------------------
      # BUILD JAR (required by Dockerfile)
      # Dockerfile expects target/*.jar to already exist
      # -pl builds only the selected service
      # -am builds its internal dependencies (shared modules)
      # ------------------------
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Build JAR — ${{ matrix.service }}
        run: |
          mvn clean package -DskipTests \
            -pl ${{ matrix.service }} \
            -am \
            --batch-mode

      # ------------------------
      # DOCKER
      # ------------------------
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Ensure Trivy installed
        run: |
          set -e

          if command -v trivy >/dev/null 2>&1; then
            echo "✅ Trivy already installed: $(trivy --version | head -1)"
            exit 0
          fi

          echo "📦 Installing Trivy via official installer..."

          mkdir -p "$HOME/.local/bin"

          # Official Trivy installer — handles version/arch automatically
          curl -fsSL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b "$HOME/.local/bin"

          echo "$HOME/.local/bin" >> $GITHUB_PATH

          echo "✅ Trivy installed: $($HOME/.local/bin/trivy --version | head -1)"

      - name: Build, Scan & Push — ${{ matrix.service }}
        run: |
          set -e
          COMMIT=${GITHUB_SHA::7}
          IMAGE=${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}

          echo "🔖 Commit : $COMMIT"
          echo "📦 Service: ${{ matrix.service }}"

          # Build image using existing Dockerfile
          docker build \
            -t $IMAGE:$COMMIT \
            -t $IMAGE:latest \
            ./${{ matrix.service }}

          # Scan BEFORE push — if CRITICAL found, nothing goes to Docker Hub
          trivy image \
            --exit-code 1 \
            --severity CRITICAL \
            --ignore-unfixed \
            --quiet \
            $IMAGE:$COMMIT

          echo "✅ Scan passed"

          docker push $IMAGE:$COMMIT
          docker push $IMAGE:latest

          # Cleanup local images to prevent disk fill on runner
          docker image rm $IMAGE:$COMMIT $IMAGE:latest || true

      # ------------------------
      # DEPLOY
      # ------------------------
      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy — ${{ matrix.service }}
        run: |
          COMMIT=${GITHUB_SHA::7}
          SHORT=$(echo "${{ matrix.service }}" | sed 's/spring-petclinic-//')

          kubectl apply -f k8s/${SHORT}-deployment.yaml -n dev
          kubectl apply -f k8s/${SHORT}-service.yaml -n dev

          kubectl set image deployment/${SHORT} \
            ${SHORT}=${{ secrets.DOCKER_USERNAME }}/${{ matrix.service }}:${COMMIT} \
            -n dev

          if ! kubectl rollout status deployment/${SHORT} -n dev --timeout=300s; then
            echo "❌ Rollout failed for ${SHORT}"
            kubectl get pods -n dev -l app=${SHORT}
            kubectl describe pods -n dev -l app=${SHORT} | tail -50
            exit 1
          fi

          echo "✅ Deployed: ${SHORT}"

  # ------------------------
  # 4. VERIFY
  # ------------------------
  verify:
    needs: deploy
    runs-on: [self-hosted, Linux, X64, k8s]
    if: always()

    steps:
      - name: Setup kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Show pod status
        run: kubectl get pods -n dev

  # ------------------------
  # 5. SUMMARY
  # ------------------------
  # ------------------------
  # 5. SUMMARY (resilient — never breaks the workflow)
  # ------------------------
  summary:
    needs: [test, detect-changes, deploy, verify]
    runs-on: [self-hosted, Linux, X64, k8s]
    if: always()

    steps:

      - name: Setup kubeconfig
        continue-on-error: true
        run: |
          set +e
          mkdir -p ~/.kube
          if [ -n "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
            chmod 600 ~/.kube/config
            echo "✅ kubeconfig ready"
          else
            echo "⚠️ KUBE_CONFIG secret is empty — cluster state will be skipped"
          fi

      - name: Generate pipeline summary
        if: always()
        continue-on-error: true
        run: |
          # Disable fail-on-error — this job must never break the workflow
          set +e

          # ---- Gather info (with safe defaults) ----
          COMMIT="${GITHUB_SHA:0:7}"
          FULL_SHA="${GITHUB_SHA:-unknown}"
          BRANCH="${{ github.event.inputs.branch || github.ref_name }}"
          BRANCH="${BRANCH:-unknown}"
          ACTOR="${{ github.actor }}"
          ACTOR="${ACTOR:-unknown}"
          TRIGGER="${{ github.event_name }}"
          TRIGGER="${TRIGGER:-unknown}"
          SELECTED="${{ github.event.inputs.service || 'auto-detect' }}"
          SERVICES='${{ needs.detect-changes.outputs.services }}'
          RUN_TIME="$(date -u +'%Y-%m-%d %H:%M:%S UTC' 2>/dev/null || echo 'unknown')"

          # ---- Job statuses (with fallback) ----
          test_status="${{ needs.test.result }}"
          detect_status="${{ needs.detect-changes.result }}"
          deploy_status="${{ needs.deploy.result }}"
          verify_status="${{ needs.verify.result }}"

          test_status="${test_status:-unknown}"
          detect_status="${detect_status:-unknown}"
          deploy_status="${deploy_status:-unknown}"
          verify_status="${verify_status:-unknown}"

          # ---- Emoji mapper ----
          emoji() {
            case "$1" in
              success)   echo "✅" ;;
              failure)   echo "❌" ;;
              cancelled) echo "⚪" ;;
              skipped)   echo "⏭️" ;;
              *)         echo "❓" ;;
            esac
          }

          # ---- Overall status ----
          overall="✅ SUCCESS"
          if [ "$test_status" = "failure" ] \
             || [ "$detect_status" = "failure" ] \
             || [ "$deploy_status" = "failure" ]; then
            overall="❌ FAILED"
          elif [ "$test_status" = "cancelled" ] \
             || [ "$detect_status" = "cancelled" ] \
             || [ "$deploy_status" = "cancelled" ]; then
            overall="⚪ CANCELLED"
          fi

          # ---- Write GitHub Actions summary ----
          SUMMARY_FILE="${GITHUB_STEP_SUMMARY:-/tmp/summary.md}"

          {
            echo "# 🚀 CI/CD Dev Pipeline — Summary"
            echo ""
            echo "## 📋 Run Information"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| 🏷️ Overall Status | **$overall** |"
            echo "| 🌿 Branch | \`$BRANCH\` |"
            echo "| 🔖 Short SHA | \`$COMMIT\` |"
            echo "| #️⃣ Full SHA | \`$FULL_SHA\` |"
            echo "| 👤 Triggered by | @$ACTOR |"
            echo "| ⚡ Trigger type | \`$TRIGGER\` |"
            echo "| 🎯 Service input | \`$SELECTED\` |"
            echo "| 🕐 Time (UTC) | $RUN_TIME |"
            echo ""
            echo "## 🧩 Job Status"
            echo ""
            echo "| Stage | Status | Result |"
            echo "|-------|--------|--------|"
            echo "| 🧪 Test | $(emoji $test_status) | \`$test_status\` |"
            echo "| 🔍 Detect changes | $(emoji $detect_status) | \`$detect_status\` |"
            echo "| 🔨 Build & Deploy | $(emoji $deploy_status) | \`$deploy_status\` |"
            echo "| ✔️ Verify | $(emoji $verify_status) | \`$verify_status\` |"
            echo ""
            echo "## 📦 Services Processed"
            echo ""
            if [ -n "$SERVICES" ] && [ "$SERVICES" != "null" ] && [ "$SERVICES" != "[]" ]; then
              # Try to parse with jq, but don't fail if it doesn't work
              if command -v jq >/dev/null 2>&1; then
                parsed=$(echo "$SERVICES" | jq -r '.[]' 2>/dev/null)
                if [ -n "$parsed" ]; then
                  echo "$parsed" | while read -r svc; do
                    [ -n "$svc" ] && echo "- 🐳 \`$svc\` → \`$COMMIT\`"
                  done
                else
                  echo "_Could not parse services list: \`$SERVICES\`_"
                fi
              else
                echo "_jq not available — raw services: \`$SERVICES\`_"
              fi
            else
              echo "_No services data available (detect-changes may have been skipped)_"
            fi
            echo ""
            echo "## 🎯 Current Dev Cluster State"
            echo ""
            echo "\`\`\`"
            if command -v kubectl >/dev/null 2>&1 && [ -f ~/.kube/config ]; then
              kubectl get pods -n dev 2>&1 || echo "(kubectl command failed)"
            else
              echo "(kubectl or kubeconfig not available)"
            fi
            echo "\`\`\`"
            echo ""
            echo "## 🔗 Useful Links"
            echo ""
            REPO="${{ github.repository }}"
            RUN_ID="${{ github.run_id }}"
            DOCKER_USER="${{ secrets.DOCKER_USERNAME }}"
            [ -n "$REPO" ] && echo "- 🐙 [Commit on GitHub](https://github.com/$REPO/commit/$FULL_SHA)"
            [ -n "$REPO" ] && [ -n "$RUN_ID" ] && echo "- 📜 [Workflow run](https://github.com/$REPO/actions/runs/$RUN_ID)"
            [ -n "$DOCKER_USER" ] && echo "- 🐳 [Docker Hub](https://hub.docker.com/u/$DOCKER_USER)"
            echo ""
            echo "---"
            echo "_Generated automatically by CI/CD pipeline_ 🤖"
          } >> "$SUMMARY_FILE" 2>/dev/null || echo "⚠️ Could not write to GITHUB_STEP_SUMMARY"

          # ---- Also print compact summary to logs ----
          echo ""
          echo "=========================================="
          echo "  📊 PIPELINE SUMMARY"
          echo "=========================================="
          echo "  Overall : $overall"
          echo "  Branch  : $BRANCH"
          echo "  Commit  : $COMMIT"
          echo "  Actor   : $ACTOR"
          echo "=========================================="
          echo "  🧪 Test           : $(emoji $test_status) $test_status"
          echo "  🔍 Detect changes : $(emoji $detect_status) $detect_status"
          echo "  🔨 Deploy         : $(emoji $deploy_status) $deploy_status"
          echo "  ✔️  Verify         : $(emoji $verify_status) $verify_status"
          echo "=========================================="

          # Always exit 0 — we must not fail the workflow
          exit 0