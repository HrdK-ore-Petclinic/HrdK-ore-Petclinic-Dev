name: Promote Image (Dev → Prod Tag)

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Select service to promote"
        required: true
        type: choice
        options:
          - all
          - spring-petclinic-admin-server
          - spring-petclinic-api-gateway
          - spring-petclinic-config-server
          - spring-petclinic-customers-service
          - spring-petclinic-discovery-server
          - spring-petclinic-genai-service
          - spring-petclinic-vets-service
          - spring-petclinic-visits-service

      version:
        description: "Prod version (e.g. v1.2.0)"
        required: true

      commit:
        description: "Optional: override commit (leave empty = latest)"
        required: false

jobs:
  promote:
    runs-on: ubuntu-latest

    env:
      SERVICES: |
        spring-petclinic-admin-server
        spring-petclinic-api-gateway
        spring-petclinic-config-server
        spring-petclinic-customers-service
        spring-petclinic-discovery-server
        spring-petclinic-genai-service
        spring-petclinic-vets-service
        spring-petclinic-visits-service

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ------------------------
      # DETERMINE COMMIT
      # ------------------------
      - name: Determine commit
        id: commit
        run: |
          if [ -z "${{ github.event.inputs.commit }}" ]; then
            COMMIT=$(git rev-parse --short HEAD)
            echo "No commit provided, using latest: $COMMIT"
          else
            COMMIT=${{ github.event.inputs.commit }}
            echo "Using provided commit: $COMMIT"
          fi

          echo "commit=$COMMIT" >> $GITHUB_OUTPUT

      # ------------------------
      # DOCKER LOGIN
      # ------------------------
      - name: Docker Login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # ------------------------
      # PROMOTE + CLEANUP
      # ------------------------
      - name: Promote Images + Remove dev/latest
        run: |
          COMMIT=${{ steps.commit.outputs.commit }}
          VERSION=${{ github.event.inputs.version }}

          for SVC in $SERVICES; do
            IMAGE=${{ secrets.DOCKER_USERNAME }}/$SVC

            SRC=$IMAGE:$COMMIT
            TARGET=$IMAGE:$VERSION

            echo "Promoting $SVC ($COMMIT → $VERSION)"

            docker pull $SRC
            docker tag $SRC $TARGET
            docker push $TARGET

            # ------------------------
            # DELETE dev + latest (REMOTE!)
            # ------------------------
            for TAG in dev latest; do
              echo "Deleting $TAG for $SVC"

              curl -s -X DELETE \
                -u "${{ secrets.DOCKER_USERNAME }}:${{ secrets.DOCKER_PASSWORD }}" \
                https://hub.docker.com/v2/repositories/${{ secrets.DOCKER_USERNAME }}/$SVC/tags/$TAG/ \
                || echo "$TAG not found or already deleted"
            done

            # optional local cleanup
            docker rmi $SRC || true
            docker rmi $TARGET || true
          done
